<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <!-- 深空底 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b1424"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#lg)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- 鹏：海鸥式双弧，整体倾斜 = 扶摇攀升 -->
  <g transform="rotate(-14 32 30)" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M 13 31 C 19 23.5, 25.5 23.5, 30.5 30"/>
    <path d="M 30.5 30 C 35.5 23.5, 42 23.5, 48 31"/>
  </g>

  <!-- 身后的风：沿攀升方向的渐弱流线 -->
  <path d="M 11 45.5 C 17 43, 23 39.5, 28 35" fill="none" stroke="url(#trail)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 19.5 52.5 C 25.5 50, 31.5 47, 36.5 43" fill="none" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>

  <!-- 前方的星：九万里之上 -->
  <circle cx="50" cy="15" r="2.3" fill="#22d3ee"/>

  <!-- 落款：半透明水印「风」（无底、极淡） -->
  <g transform="translate(52.8 55.4) scale(0.115)" opacity="0.32">
    <text x="0" y="0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
          font-size="48" font-weight="700" fill="url(#lg)">风</text>
  </g>
</svg>
