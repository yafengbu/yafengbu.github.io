        stack: Agent ｜ RAG ｜ Prompt 设计 ｜ DAG 调度 ｜ Self-Reflection ｜ Langfuse
        desc: 自研企业级智能问答 Agent，通过任务拆解 + DAG 并行调度 + RAG 检索增强 + 反思容错，解决复杂多跳问答的回答准确性与系统效率问题。
        bullets:
          - 任务拆解：基于 Understanding 模型设计 Prompt，将用户输入自动拆解为带依赖关系的 DAG 子任务，支持搜索 / 蒸馏 / 总结等类型子任务动态识别，拆解准确率 92%+
          - DAG 并行调度：自研轻量级 DAG 调度器，并行执行无依赖节点，子任务封装为标准单元（Query 改写 → 搜索规划 → 搜索 → 相关性判别 → 召回相关内容），并管理上下文与中间状态；相比串行方案平均响应时间降低 42%+
          - 反思容错：子任务召回为空触发一轮 Self-Reflection 回退到重新规划检索，使问答成功率从 76% 提升至 88%
          - 工具化封装：以自研标准 API 承载工具调用，搜索 / 蒸馏抽象为可注册工具单元，与 MCP 范式同源可迁移标准 Server
          - 总结与后处理：设计 Prompt 模板引导 LLM 整合多源召回内容并去冗，输出带引用依据的回答；后处理校验（安全过滤 / 格式增强 / 免责声明）保障可靠性
          - 评测闭环：基于 OpenCompass 框架，以任务成功率为核心指标构建评测集与自动化评测流程，结合 Langfuse trace 归因失败并沉淀 Bad Case 库驱动版本迭代
