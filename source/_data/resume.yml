        desc: 构建支持 PDF / Word / PPT 的文档解析 Agent，融合多模态理解、RAG 与工具调用，自动提取关键字段（金额、签署方、签名、日期）输出 JSON / Markdown，服务于财务、运营商等自动化流程场景。
        bullets:
          - 文档解析：结合开源工具与 OCR 实现版面感知解析，提取文本 / 图像 / 页眉页脚 / 手写签名等元信息，输出结构化 JSON 保留语义
          - 多模态 RAG：基于 langchain_text_splitters 做长文本智能切块，文本与图片特征向量存入 Faiss 做 Top-K 召回，对比纯文本 RAG 关键信息定位 F1 提升 18%
          - 结构化输出：固定格式 Prompt 引导 Qwen-VL 输出 JSON / Markdown 结构文本，引入后处理校验机制（正则 / 枚举约束）确保字段合规
          - 工具化封装：将文档解析 / 字段抽取 / 校验能力封装为 Agent 可调的标准工具，统一入参 Schema 与结构化返回，对接 Qwen-VL 完成版面理解与字段定位
          - 异步微服务：基于 FastAPI + Uvicorn + HTTPX 构建全链路异步 API，支持高并发文档上传与异步结果轮询，日均处理 6000+ 文档，支撑华为 GTS 与三大运营商等核心业务
          - Bad Case 闭环：集成 Langfuse 对关键环节 trace 级埋点实现链路可视化，结合反馈沉淀 Bad Case 迭代模型与 Prompt
